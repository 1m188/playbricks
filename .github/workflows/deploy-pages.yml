# 部署网页版打砖块到 GitHub Pages
#
# 站点内容来自 web/ 目录（纯静态，无需构建步骤），
# 部署成功后访问 https://<用户名>.github.io/<仓库名>/ 即可直接游玩。
#
# 首次部署说明：
#   Configure Pages 步骤会尝试通过 API 自动启用 Pages（Source: GitHub Actions）。
#   若你的仓库/组织策略不允许自动启用（表现为 Configure Pages 或 Deploy 步骤报错），
#   手动到仓库 Settings → Pages → Build and deployment 把 Source 设为
#   "GitHub Actions"，然后在 Actions 页面手动重跑即可，仅需设置一次。

name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，避免并发冲突（后到的运行会排队等待）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Pages 未启用时尝试自动启用（Source: GitHub Actions）
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 只上传 web/ 目录作为站点根，Qt/C++ 源码不进入站点
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
